---
services:
  db:
    image: sruthikumari94/dbimage:latest
    deploy:
      replicas: 1
    ports:
      - "3306:3306"
    networks:
      - mynetwork

  auth_service:
    image: sruthikumari94/authimage:latest
    deploy:
      replicas: 1
    ports:
      - "1111:5001"
    networks:
      - mynetwork
    depends_on:
      - db
    

  book_service:
    image: sruthikumari94/bookimage:latest
    deploy:
      replicas: 1
    ports:
      - "1112:5002"
    networks:
      - mynetwork
    depends_on:
      - db
  borrow_service:
    image: sruthikumari94/borrowimage:latest
    deploy:
      replicas: 1
    ports:
      - "1113:5003"
    networks:
      - mynetwork
    depends_on:
      - db

  frontend:
    image: sruthikumari94/pythonapp:latest
    deploy:
      replicas: 1
    ports:
      - "1114:5000"
    networks:
      - mynetwork
    depends_on:
      - auth_service
      - book_service
      - borrow_service

networks:
  mynetwork:
    driver: overlay
